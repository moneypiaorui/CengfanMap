name: Sync Vercel deployments

on:
  repository_dispatch:
    types:
      - vercel.deployment.ready
      - vercel.deployment.success
      - vercel.deployment.promoted
      - vercel.deployment.error
      - vercel.deployment.failed
      - vercel.deployment.canceled
      - vercel.deployment.ignored
      - vercel.deployment.skipped

permissions: {}

concurrency:
  group: vercel-deployment-${{ github.event.client_payload.id || github.run_id }}
  cancel-in-progress: false

jobs:
  sync:
    name: Record deployment result
    if: >-
      github.event.sender.login == 'vercel[bot]' &&
      github.event.client_payload.project.id == 'prj_2sRvjeG45FSEPRdlGwOJo9rlySqW'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      deployments: write
    steps:
      - name: Update GitHub Deployments
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const data = context.payload.client_payload;
            const event = context.payload.action.replace('vercel.deployment.', '');
            const sha = data.git?.sha;
            const branch = data.git?.ref;
            if (!/^[a-f0-9]{40}$/i.test(sha ?? '') || !branch || !data.environment) {
              throw new Error('Missing or invalid Vercel Git/environment metadata');
            }
            if (data.id && !/^dpl_[a-zA-Z0-9]+$/.test(data.id)) {
              throw new Error('Invalid Vercel deployment ID');
            }

            const production = data.environment === 'production';
            const environment = production ? 'Production' :
              `${data.environment === 'preview' ? 'Preview' : data.environment} / ${branch}`;
            if (environment.length > 255) throw new Error('Environment name is too long');
            const states = {
              ready: production ? 'in_progress' : 'success',
              success: 'success', promoted: 'success',
              error: 'failure', failed: 'failure',
              canceled: 'inactive', ignored: 'inactive', skipped: 'inactive',
            };
            const state = states[event];
            if (!state) throw new Error('Unsupported Vercel deployment event');

            let environmentUrl;
            if (data.url) {
              const url = new URL(data.url);
              if (url.protocol !== 'https:' || url.username || url.password ||
                  !url.hostname.endsWith('.vercel.app') || url.pathname !== '/' ||
                  url.search || url.hash) {
                throw new Error('Expected a Vercel HTTPS deployment origin');
              }
              environmentUrl = url.origin;
            } else if (state === 'success' || state === 'in_progress') {
              throw new Error('Successful Vercel deployment is missing its URL');
            }
            if (production && state === 'success' &&
                data.alias?.includes('cengfan-map-six.vercel.app')) {
              environmentUrl = 'https://cengfan-map-six.vercel.app';
            }

            const logUrl = data.id ?
              `https://vercel.com/moneypiaoruis-projects/cengfan-map/${data.id.slice(4)}` :
              'https://vercel.com/moneypiaoruis-projects/cengfan-map/deployments';
            // Failure events may omit the deployment ID and URL. Keep those
            // reports distinct without claiming an unverified external ID.
            const key = data.id ?? `event-${context.runId}`;
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              ...context.repo, sha, environment, task: 'deploy', per_page: 100,
            });
            const metadata = deployment => {
              try {
                return typeof deployment.payload === 'string' ?
                  JSON.parse(deployment.payload) : deployment.payload;
              } catch { return null; }
            };
            let deployment = deployments.find(item => {
              const payload = metadata(item);
              return payload?.provider === 'vercel' &&
                payload.projectId === data.project.id && payload.key === key;
            });
            if (!deployment) {
              ({ data: deployment } = await github.rest.repos.createDeployment({
                ...context.repo, ref: sha, task: 'deploy', environment,
                auto_merge: false, required_contexts: [],
                transient_environment: !production,
                production_environment: production,
                description: `Vercel deployment from ${branch}`.slice(0, 140),
                payload: { provider: 'vercel', projectId: data.project.id,
                  key, vercelDeploymentId: data.id ?? null, branch },
              }));
            }
            const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
              ...context.repo, deployment_id: deployment.id, per_page: 1,
            });
            const latest = statuses[0]?.state;
            // A delayed ready event must not turn an already live production
            // deployment back into an in-progress deployment.
            if (latest !== state &&
                !(state === 'in_progress' && ['success', 'failure', 'inactive'].includes(latest))) {
              await github.rest.repos.createDeploymentStatus({
                ...context.repo, deployment_id: deployment.id, state,
                environment, environment_url: environmentUrl, log_url: logUrl,
                description: `Vercel: ${event}`, auto_inactive: true,
              });
            }
            const { data: verified } = await github.rest.repos.listDeploymentStatuses({
              ...context.repo, deployment_id: deployment.id, per_page: 1,
            });
            core.info(`GitHub deployment ${deployment.id}: ${verified[0]?.state} (${environment}, ${sha})`);
            await core.summary.addHeading('Vercel deployment recorded')
              .addTable([
                [{ data: 'Environment', header: true }, { data: 'Commit', header: true },
                 { data: 'Status', header: true }, { data: 'GitHub deployment', header: true }],
                [environment, sha, verified[0]?.state ?? 'unknown', String(deployment.id)],
              ])
              .addLink('GitHub Deployments', `https://github.com/${context.repo.owner}/${context.repo.repo}/deployments`)
              .addRaw(' · ').addLink('Vercel deployment', logUrl).write();
