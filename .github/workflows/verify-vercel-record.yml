name: Verify native Vercel deployment record

on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-vercel-record.yml]

permissions:
  deployments: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read GitHub deployment records
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const sha = '2f3635f31bf6f06c453978f85cc39ecef2894a13';
            const { data: deployments } = await github.rest.repos.listDeployments({
              ...context.repo, sha, per_page: 100,
            });
            const results = [];
            for (const deployment of deployments) {
              const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                ...context.repo, deployment_id: deployment.id, per_page: 1,
              });
              results.push({
                id: deployment.id, sha: deployment.sha, ref: deployment.ref,
                environment: deployment.environment,
                creator: deployment.creator?.login,
                app: deployment.performed_via_github_app?.slug,
                state: statuses[0]?.state ?? 'pending',
                environment_url: statuses[0]?.environment_url,
                log_url: statuses[0]?.log_url,
              });
            }
            core.info('DEPLOYMENT_RECORDS ' + JSON.stringify(results));
            if (!results.length) {
              core.warning('No GitHub Deployment records found for the verified Vercel commit');
            }
            await core.summary.addHeading('Native Vercel deployment record inspection')
              .addCodeBlock(JSON.stringify(results, null, 2), 'json').write();
